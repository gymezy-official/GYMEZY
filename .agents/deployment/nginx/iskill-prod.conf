# ==============================================================================
# Nginx Gateway Configuration - iSkill Production
# Domains:
#   Frontend: iskill.softrateglobal.com
#   API Gateway: api.iskill.softrateglobal.com
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
  listen 80;
  listen [::]:80;
  server_name iskill.softrateglobal.com api.iskill.softrateglobal.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ------------------------------------------------------------------------------
# Frontend Application (SPA) - iskill.softrateglobal.com
# ------------------------------------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name iskill.softrateglobal.com;

  ssl_certificate     /etc/letsencrypt/live/iskill-prod/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/iskill-prod/privkey.pem;
  include /etc/nginx/snippets/ssl-common.conf;

  location / {
    set $up http://iskill-prod-web:80;
    proxy_pass $up;
    include /etc/nginx/snippets/proxy-common.conf;
  }
}

# ------------------------------------------------------------------------------
# API Gateway & Middleware - api.iskill.softrateglobal.com
# ------------------------------------------------------------------------------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.iskill.softrateglobal.com;

  ssl_certificate     /etc/letsencrypt/live/iskill-prod/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/iskill-prod/privkey.pem;
  include /etc/nginx/snippets/ssl-common.conf;

  client_max_body_size 50M;

  location / {
    set $up http://iskill-prod-api:4500;
    proxy_pass $up;
    include /etc/nginx/snippets/proxy-common.conf;
  }
}

